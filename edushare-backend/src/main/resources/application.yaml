spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:edudb}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    repair-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:edu-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  graphql:
    schema:
      locations: classpath:graphql/**/
      file-extensions: .graphql
    graphiql:
      enabled: true
      introspection:
        enabled: true
token:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
  access-token:
    ttl:
      seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh-token:
    ttl:
      days: ${JWT_REFRESH_TTL_DAYS:7}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  secure: true


app:
  counter:
    flush:
      fixed-delay-ms: 60000
      lock-timeout-seconds: 10
  feed:
    cache-ttl-seconds: ${FEED_CACHE_TTL_SECONDS:30}
    discovery-cache-ttl-seconds: ${DISCOVERY_FEED_CACHE_TTL_SECONDS:30}

chatbot:
  python-service:
    base-url: ${PYTHON_RAG_URL:http://localhost:8000}
    timeout: 30s