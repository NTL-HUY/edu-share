spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/edudb
    username: admin
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
token:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
  access-token:
    ttl:
      seconds: ${JWT_ACCESS_TTL_SECONDS:900}
  refresh-token:
    ttl:
      days: 7