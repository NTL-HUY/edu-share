services:
  postgres-dg:
    image: pgvector/pgvector:pg16
    container_name: postgres-sql-edu
    environment:
      POSTGRES_DB: edudb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports: # Map cổng (Port ở máy thật : Port trong container)
      - "5432:5432"
    volumes: # Luu trữ dữ liệu bền vững (không mất data khi xoá container)
      - pgdata:/var/lib/postgresql/data
    networks: # Mạng nội bộ để các container giao tiếp với nhau
      - my-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka-edu
    ports:
      - "9092:9092"       # dùng cho client bên ngoài container (app Spring Boot chạy local)
      - "9093:9093"       # controller port (nội bộ)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - my-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - my-network

  redis:
    image: redis:7-alpine
    container_name: redis-edu
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - my-network

volumes:
  pgdata:
    driver: local
  kafka-data:
    driver: local
  redis-data:
    driver: local

networks:
  my-network:
    driver: bridge